<!doctype html>
<meta charset="utf-8"><style data-dc-design-system-vars>@layer{:root{--surface:#f2efe8;--surface-alt:#e7e3da;--ink:#16181d;--ink-muted:#3d3f45;--star-red:#b0272d;--star-gold:#f4e4bc;--sand:#d9cbb0;--night:#121a2e;--space-2:8px;--space-4:16px;--space-8:32px;--space-16:64px;--radius-none:0px;--radius-sm:6px;--radius-seal:16px;--font-display:"Fraunces", Georgia, serif;--font-sans:"Archivo", system-ui, sans-serif;--text-display-xl:900 96px/0.9 var(--font-display);--text-display-l:900 56px/0.95 var(--font-display);--text-heading:800 32px/1.1 var(--font-display);--text-body:400 16px/24px var(--font-sans);--text-small:400 14px/20px var(--font-sans);--text-tagline:400 13px/18px var(--font-sans);--text-label:500 11px/16px var(--font-sans);}}</style>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>MAUNI — экспонаты</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400;62..125,500;62..125,700&amp;family=Fraunces:ital,opsz,wght@0,9..144,900;1,9..144,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#16181D}a:hover{color:#B0272D}
</style>
</helmet>
<div style="font-family: 'Archivo', system-ui, sans-serif; color: #16181D; background: #FFFFFF; font-size: 15px; line-height: 1.35">

<header style="border-bottom: 1px solid #B0272D">
<div style="padding: 20px 40px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px">
<a href="index.html" style="display: flex; align-items: center"><img src="./assets/5587ad4ea082308fea3f0e244417dbc3.svg" alt="mauni — на главную" style="height: 26px; width: auto; display: block"></a>
<nav style="display: flex; flex-wrap: wrap; gap: 28px; font-size: 12px; font-weight: 500; font-stretch: 125%; letter-spacing: 4px">
<a href="index.html" style="text-decoration: none">ГЛАВНАЯ</a>
<a href="exhibits.html" style="text-decoration: none; color: #B0272D">ЭКСПОНАТЫ</a>
<a href="index.html#night" style="text-decoration: none">KASPI</a>
<a href="https://instagram.com/mauni.kz" style="text-decoration: none">INSTAGRAM</a>
</nav>
</div>
</header>

<main style="padding: 48px 40px 96px; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">

<aside style="flex: 0 0 180px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; text-align: right; padding-top: 64px">
<div style="font-size: 11px; font-weight: 500; font-stretch: 125%; letter-spacing: 4px; color: #3D3F45; margin-bottom: 8px">ЗАЛЫ</div>
<sc-for list="{{ cats }}" as="c" hint-placeholder-count="6">
<button type="button" onClick="{{ c.pick }}" style="background: none; border: 0; padding: 4px 0; font: inherit; font-size: 15px; cursor: pointer; color: {{ c.color }}; text-decoration: {{ c.deco }}; text-underline-offset: 4px">{{ c.label }}</button>
</sc-for>
<div style="font-size: 11px; font-weight: 500; font-stretch: 125%; letter-spacing: 4px; color: #3D3F45; margin: 28px 0 8px">ПОРЯДОК</div>
<span style="padding: 4px 0">Новые</span>
<span style="padding: 4px 0">Цена ↑</span>
<span style="padding: 4px 0">Цена ↓</span>
</aside>

<section style="flex: 1 1 640px; min-width: 0">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: 24px">
<h1 style="margin: 0; font-size: 13px; font-weight: 700; font-stretch: 125%; letter-spacing: 5px">ЗАЛ ЭКСПОНАТОВ · {{ title }}</h1>
<div style="font-size: 13px; color: #3D3F45">{{ count }}</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); border-top: 1px solid #B0272D; border-left: 1px solid #B0272D">
<sc-for list="{{ shown }}" as="it" hint-placeholder-count="12">
<a href="index.html#night" style="text-decoration: none; color: #16181D; border-right: 1px solid #B0272D; border-bottom: 1px solid #B0272D; height: 500px; box-sizing: border-box; padding: 22px 22px 18px; display: flex; flex-direction: column; background: #FFFFFF">
<div style="display: flex; gap: 14px; align-items: flex-start">
<div style="flex: 0 0 auto; font-family: 'Fraunces', Georgia, serif; font-weight: 900; font-size: 15px; color: #B0272D">№{{ it.num }}</div>
<div style="flex: 1 1 auto; min-width: 0">{{ it.name }}</div>
<div style="flex: 0 0 auto; white-space: nowrap">{{ it.price }}</div>
</div>
<div style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; text-align: center">
<span style="font-size: 11px; letter-spacing: 3px; color: #5A5C62">[ФОТО НА ПРОЗРАЧНОМ ФОНЕ]</span>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 500; font-stretch: 125%; letter-spacing: 3px; color: #3D3F45">
<span>{{ it.cat }}</span>
<svg viewBox="0 0 40 40" width="16" height="16" aria-hidden="true"><circle cx="20" cy="10" r="6" fill="#B0272D"></circle><circle cx="10" cy="27.5" r="6" fill="#B0272D"></circle><circle cx="30" cy="27.5" r="6" fill="#B0272D"></circle></svg>
</div>
</a>
</sc-for>
</div>
</section>
</main>

<footer id="kaspi" style="background: #121A2E; color: #F2EFE8">
<div style="padding: 56px 40px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 24px; font-size: 13px; font-stretch: 125%; letter-spacing: 4px">
<a href="index.html" style="color: #F2EFE8">← НАЗАД НА ВЕРШИНУ</a>
<div style="display: flex; flex-wrap: wrap; gap: 32px">
<a href="index.html#night" style="color: #F2EFE8">KASPI [ССЫЛКА]</a>
<a href="https://instagram.com/mauni.kz" style="color: #F2EFE8">INSTAGRAM @MAUNI.KZ</a>
<a href="index.html#night" style="color: #F2EFE8">WHATSAPP [НОМЕР]</a>
</div>
</div>
</footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2000}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { cat: 'all' };
}
renderVals() {
const items = [
{ cat: 'KAWS', name: 'KAWS Companion [МОДЕЛЬ]' },
{ cat: 'BE@RBRICK', name: 'BE@RBRICK 1000% [СЕРИЯ]' },
{ cat: 'GOYARD', name: 'Goyard Saint-Sulpice Card Holder [ЦВЕТ]' },
{ cat: "ARC'TERYX", name: "Arc'teryx [МОДЕЛЬ КУРТКИ]" },
{ cat: 'KAWS', name: 'KAWS Holiday [МОДЕЛЬ]' },
{ cat: 'BE@RBRICK', name: 'BE@RBRICK 400% + 100% [СЕРИЯ]' },
{ cat: 'ОДЕЖДА', name: 'Шапка [БРЕНД, ЦВЕТ]' },
{ cat: 'GOYARD', name: 'Goyard [МОДЕЛЬ КОШЕЛЬКА]' },
{ cat: "ARC'TERYX", name: "Arc'teryx Bird Head Toque [ЦВЕТ]" },
{ cat: 'KAWS', name: 'KAWS [МОДЕЛЬ]' },
{ cat: 'ОДЕЖДА', name: 'Худи [БРЕНД, ЦВЕТ]' },
{ cat: 'BE@RBRICK', name: 'BE@RBRICK [СЕРИЯ]' }
].map((x, i) => ({ ...x, num: String(i + 1).padStart(2, '0'), price: '[ЦЕНА] ₸' }));
const labels = [['all', 'Все'], ['KAWS', 'KAWS'], ['BE@RBRICK', 'BE@RBRICK'], ['GOYARD', 'Goyard'], ["ARC'TERYX", "Arc'teryx"], ['ОДЕЖДА', 'Одежда']];
const cur = this.state.cat;
const cats = labels.map(([id, label]) => ({
label,
color: id === cur ? '#B0272D' : '#16181D',
deco: id === cur ? 'underline' : 'none',
pick: () => this.setState({ cat: id })
}));
const shown = cur === 'all' ? items : items.filter((x) => x.cat === cur);
const n = shown.length;
const word = n % 10 === 1 && n % 100 !== 11 ? 'экспонат' : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? 'экспоната' : 'экспонатов');
const title = (labels.find(([id]) => id === cur) || ['', 'Все'])[1].toUpperCase();
return { cats, shown, count: n + ' ' + word, title };
}
}
</script>
</body>
</html>
