<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAUNI</title>
<meta name="description" content="MAUNI — Kaspi магазин, Instagram и WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500;62..125,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1f232b;
    --ink: #f2efe8;
    --red: #b0272d;
    --red-dark: #8f1f24;
    --muted: #c9c5bc;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Archivo', system-ui, sans-serif;
  }

  .hero {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 16px;
  }
  .scene {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center bottom;
    z-index: 0;
  }

  .stack {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    width: 100%;
    margin-top: 6vh;
  }
  .logo {
    width: min(340px, 78vw);
    height: auto;
    display: block;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: min(310px, 88vw);
  }
  .links a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 46px;
    padding: 0 18px;
    border: 1px solid var(--muted);
    color: var(--ink);
    text-decoration: none;
    font-stretch: 125%;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    background: rgba(31, 35, 43, 0.6);
    transition: background 0.2s, border-color 0.2s, color 0.2s;
  }
  .links a:hover,
  .links a:focus-visible {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--bg);
  }
  .links a.primary {
    background: var(--red);
    border-color: var(--red);
  }
  .links a.primary:hover,
  .links a.primary:focus-visible {
    background: var(--red-dark);
    border-color: var(--red-dark);
    color: var(--ink);
  }
  .links a .arrow {
    font-size: 14px;
    letter-spacing: 0;
  }

  @media (max-width: 480px) {
    .stack { gap: 24px; margin-top: 4vh; }
  }
</style>
</head>
<body>
<main class="hero">
  <img class="scene" src="./assets/2740d315005f6f7cb13c9dfdaf0c88f6.svg" alt="" aria-hidden="true">
  <div class="stack">
    <img class="logo" src="./assets/9fd80deaf1095ac3d5ece139b1cbce13.svg" alt="mauni">
    <nav class="links">
      <!-- Ссылка на магазин Kaspi: вставьте адрес вместо # -->
      <a class="primary" href="#">Kaspi магазин <span class="arrow">→</span></a>
      <a href="https://instagram.com/mauni.kz" target="_blank" rel="noopener">Instagram <span class="arrow">→</span></a>
      <!-- WhatsApp: вставьте номер в формате 7XXXXXXXXXX вместо X -->
      <a href="https://wa.me/7XXXXXXXXXX" target="_blank" rel="noopener">WhatsApp <span class="arrow">→</span></a>
    </nav>
  </div>
</main>
</body>
</html>
