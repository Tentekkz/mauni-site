<body class="hall-page">
  <!-- Стена с экспонатами: рамки добавляет intro.js -->
  <div class="hall-wall" id="hall-wall" aria-hidden="true"></div>

  <!-- То, что видно при включённом свете. Без JS страница просто показывает это меню. -->
  <main class="hall-plaque" id="hall-plaque">
    <img class="hall-plaque-logo" src="./assets/logo-dark.svg" alt="MAUNI" width="220" height="62">
    <nav class="hall-links">
      <a class="primary" href="catalog.html">
        <span data-i18n="home.enter">Войти в зал</span>
        <span class="arrow">→</span>
      </a>
      <a href="https://kaspi.kz/shop/info/merchant/30051789/address-list" target="_blank" rel="noopener">
        <span data-i18n="home.kaspi">Kaspi магазин</span>
        <span class="arrow">↗</span>
      </a>
      <a href="https://instagram.com/mauni.kz" target="_blank" rel="noopener">
        <span>Instagram</span>
        <span class="arrow">↗</span>
      </a>
      <a href="https://wa.me/77766088813" target="_blank" rel="noopener">
        <span>WhatsApp</span>
        <span class="arrow">↗</span>
      </a>
    </nav>
    <div class="hall-plaque-foot">
      <button type="button" class="hall-relight" id="hall-relight" data-i18n="intro.off" hidden>Выключить свет</button>
      <button type="button" class="hall-relight lang-toggle" data-lang-toggle>Қаз</button>
    </div>
  </main>

  <!-- Темнота с лучом фонаря -->
  <div class="hall-dark" id="hall-dark" hidden></div>

  <div class="hall-hud" id="hall-hud" hidden>
    <img class="hall-hud-logo" src="./assets/9fd80deaf1095ac3d5ece139b1cbce13.svg" alt="" width="200" height="57">
    <p class="hall-hint" id="hall-hint" data-i18n="intro.closed">Зал закрыт. Посветите на стену</p>
    <div class="hall-hud-bottom">
      <span class="hall-found" id="hall-found"></span>
      <button type="button" class="hall-switch" id="hall-switch" data-i18n="intro.on">Включить свет</button>
    </div>
  </div>

  <script src="./analytics.js" defer></script>
  <script src="./i18n.js" defer></script>
  <script src="./intro-data.js" defer></script>
  <script src="./intro.js" defer></script>
</body>

</html>
