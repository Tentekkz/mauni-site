name: Auto Sync Catalog from KitSeller

on:
  schedule:
    # Р—Р°РїСѓСЃРє РєР°Р¶РґС‹Рµ 6 С‡Р°СЃРѕРІ
    - cron: '0 */6 * * *'
  # Р’РѕР·РјРѕР¶РЅРѕСЃС‚СЊ Р·Р°РїСѓСЃС‚РёС‚СЊ СЃРёРЅС…СЂРѕРЅРёР·Р°С†РёСЋ РІСЂСѓС‡РЅСѓСЋ РІ РѕРґРёРЅ РєР»РёРє РёР· РёРЅС‚РµСЂС„РµР№СЃР° GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run KitSeller synchronizer
        run: node sync.js

      - name: Build product pages and sitemap
        run: node build-pages.js

      - name: Commit and push changes if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add products.js data e hall intro-data.js catalog.html sitemap.xml robots.txt
          if git diff --staged --quiet; then
            echo "РљР°С‚Р°Р»РѕРі Р°РєС‚СѓР°Р»РµРЅ, РёР·РјРµРЅРµРЅРёР№ РЅРµС‚."
          else
            git commit -m "РђРІС‚РѕРјР°С‚РёС‡РµСЃРєР°СЏ СЃРёРЅС…СЂРѕРЅРёР·Р°С†РёСЏ С‚РѕРІР°СЂРѕРІ СЃ KitSeller / Kaspi"
            git push
          fi

